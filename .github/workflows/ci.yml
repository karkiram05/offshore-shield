name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python3 -m pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: pip install bandit pip-audit

      - name: Bandit (static analysis for common security issues)
        run: bandit -r detection vuln lab scenarios dashboard -q

      - name: pip-audit (known-vulnerable dependency scan)
        # Fails on any advisory with a fix available. A finding with no fix
        # yet gets an explicit `--ignore-vuln <id>` with a re-check date,
        # not a blanket `|| true`. pip-audit can't look up advisories for
        # trustgraph (a first-party git dependency, not on PyPI) -- that
        # always makes it report the dependency as unauditable and exit
        # non-zero regardless of whether either project has an actual
        # vulnerability, so this filters requirements.txt down to the
        # PyPI-published subset before auditing (trustgraph runs its own
        # pip-audit in its own repo's CI against its own dependency tree).
        run: |
          grep -v '^trustgraph' requirements.txt | grep -v '@ git+' > /tmp/pypi-requirements.txt
          pip-audit -r /tmp/pypi-requirements.txt
