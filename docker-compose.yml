services:
  lab:
    build: .
    ports:
      # Loopback only -- this lab has no authentication in front of it and
      # is meant to be attacked by you, from inside, not exposed.
      - "127.0.0.1:6502:6502"
      - "127.0.0.1:6521:6521"
    volumes:
      - ./logs:/app/logs
      - ./data/kelmarsh:/app/data/kelmarsh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stdin_open: true
    tty: true
