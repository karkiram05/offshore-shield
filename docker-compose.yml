services:
  lab:
    build: .
    ports:
      # Loopback only -- this lab has no authentication in front of it and
      # is meant to be attacked by you, from inside, not exposed.
      - "127.0.0.1:6502:6502"
      - "127.0.0.1:6521:6521"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    stdin_open: true
    tty: true
